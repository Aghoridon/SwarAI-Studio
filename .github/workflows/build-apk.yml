name: Build SwarAI Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle assembleDebug --no-daemon 2>&1 | tee gradle_out.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== TOP 75 LOG LINES ==="
            head -n 75 gradle_out.log
            exit "$EXIT_CODE"
          fi

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SwarAI-Studio-v1.0.apk

      - name: Upload SwarAI Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarAI-Studio-APK
          path: release-apk/SwarAI-Studio-v1.0.apk
          retention-days: 30
