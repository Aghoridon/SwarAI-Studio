name: Build SwarAI Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          curl -sSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle-8.4.zip
          unzip -q gradle-8.4.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SwarAI-Studio-v1.0.apk

      - name: Upload SwarAI Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarAI-Studio-APK
          path: release-apk/SwarAI-Studio-v1.0.apk
          retention-days: 30
