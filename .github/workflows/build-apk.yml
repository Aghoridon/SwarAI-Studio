name: Build SwarAI Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.4 --no-daemon
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_out.log || {
            echo "=== LINES ABOVE ERROR ==="
            grep -n -C 8 "DependencyHandler.module\|FAILURE:" gradle_out.log | tail -n 30
            exit 1
          }

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SwarAI-Studio-v1.0.apk

      - name: Upload SwarAI Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarAI-Studio-APK
          path: release-apk/SwarAI-Studio-v1.0.apk
          retention-days: 30
