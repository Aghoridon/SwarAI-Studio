name: Build SwarAI Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          build-tools: '34.0.0'

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_out.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== CAUSED BY ==="
            grep -n -A 15 "Caused by:" gradle_out.log | head -n 30
            exit "$EXIT_CODE"
          fi

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SwarAI-Studio-v1.0.apk

      - name: Upload SwarAI Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarAI-Studio-APK
          path: release-apk/SwarAI-Studio-v1.0.apk
          retention-days: 30
